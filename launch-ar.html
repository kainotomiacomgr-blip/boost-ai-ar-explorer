*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#101c25;color:#eff8f5;font:1rem/1.45 system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:max(22px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
small{color:#cef481;font-weight:700}h1{font-size:clamp(1.8rem,8vw,3rem);letter-spacing:-.045em;line-height:1.04;margin:.25em 0 .45em}
.stage{position:relative;height:clamp(235px,46dvh,415px);overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 46%,#436478,#172c38 70%);border:1px solid #3d5b69;border-radius:20px}
.stage::before{content:"";position:absolute;left:22%;right:22%;bottom:13%;height:9%;border-radius:50%;background:#081420;filter:blur(14px);opacity:.7}
.object{position:absolute;inset:0;animation:hover 4s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(-4px)}50%{transform:translateY(-15px)}}
@media(prefers-reduced-motion:reduce){.object{animation:none}}
.preview,model-viewer{position:absolute;inset:0;width:100%;height:100%;display:block}
.preview{object-fit:contain;pointer-events:none}
model-viewer{opacity:0;transition:opacity .3s;--poster-color:transparent}
.stage.ready model-viewer{opacity:1}
.stage.ready .preview{visibility:hidden}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.button{display:inline-flex;align-items:center;min-height:46px;padding:10px 14px;border-radius:10px;font-weight:750;text-decoration:none;background:#cef481;color:#111f16}
.button.secondary{border:1px solid #628089;background:#1b3340;color:#eff8f5}
.button[rel="ar"]::after{content:"Place in your space"}.button img{width:0;height:0}
.actions [hidden]{display:none}
.detail{color:#c6ddd9}.lesson{color:#a8e9e0}
