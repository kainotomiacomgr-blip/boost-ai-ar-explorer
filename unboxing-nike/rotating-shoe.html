<script>
const stage=document.querySelector('#stage')
const shoe=document.querySelector('#shoe-link')
shoe.addEventListener('click',event=>{
  if(!stream||camera.hidden||camera.paused||stage.hidden)event.preventDefault()
})
const camera = document.querySelector('#camera')
const retry = document.querySelector('#camera-retry')
const openButton = retry.querySelector('button')
let stream
let opening = false
let visible = true

function closeCamera() {
  const active = stream
  stream = undefined
  active?.getTracks().forEach(track => track.stop())
  camera.srcObject = null
  camera.hidden = true
  stage.hidden = true
  
}

async function openCamera() {
  if (opening || stream || !visible) return
  if (!navigator.mediaDevices?.getUserMedia) {
    retry.hidden = false
    retry.querySelector('p').textContent = 'Open this page in Safari or Chrome to use the camera.'
    openButton.hidden = true
    return
  }
  opening = true
  openButton.disabled = true
  try {
    const active = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}}})
    if (!visible) {
      active.getTracks().forEach(track => track.stop())
      return
    }
    stream = active
    camera.muted = true
    camera.srcObject = active
    camera.hidden = false
    await camera.play()
    if (stream !== active) return
    retry.hidden = true
    stage.hidden = false
    
  } catch {
    closeCamera()
    if (visible) retry.hidden = false
  } finally {
    opening = false
    openButton.disabled = false
  }
}

openButton.addEventListener('click', openCamera)
camera.addEventListener('pause',()=>{stage.hidden=true})
camera.addEventListener('playing',()=>{if(stream&&!camera.hidden){stage.hidden=false}})
window.addEventListener('pagehide', () => {
  visible = false
  closeCamera()
})
window.addEventListener('pageshow', event => {
  visible = true
  if (event.persisted && !document.querySelector('#map-screen').hidden) openCamera()
})
if (new URLSearchParams(location.search).has('qr')) {
  document.querySelector('#map-screen').hidden = true
  document.querySelector('#qr').hidden = false
} else {
  openCamera()
}


</script></body></html>
