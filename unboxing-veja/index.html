<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#192c22">
<title>VEJA · UNBOXING case study</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 20px;background:radial-gradient(ellipse at 50% 43%,#3d5946,#192c22 75%);color:#f8f8ed;font:1rem/1.5 system-ui,sans-serif;text-align:center}
main{width:min(100%,34rem)}
.project{margin:0 0 .55rem;color:#d2edb7;font-size:.8rem;font-weight:750;letter-spacing:.12em}
h1{margin:0;font-size:clamp(2.5rem,10vw,4.4rem);line-height:1}
.topic{margin:.6rem 0 0;color:#e4eadc}
.objects{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,28px);min-height:clamp(180px,44vw,266px);padding-top:12px}
.box-art{position:relative;width:min(66vw,340px);aspect-ratio:1.8;filter:drop-shadow(0 20px 12px #0007);animation:float 2.6s ease-in-out infinite alternate}
.box-art span{position:absolute;inset:0}
.box-top{background:#e7bf89;clip-path:polygon(1% 39%,27% 8%,99% 24%,73% 56%)}
.box-front{background:#c79661;clip-path:polygon(2% 40%,73% 56%,73% 92%,2% 75%)}
.box-side{background:#90633e;clip-path:polygon(73% 56%,98% 24%,98% 59%,73% 92%)}
.box-lid{background:#f0c795;clip-path:polygon(1% 38%,73% 53%,99% 23%,99% 31%,73% 62%,1% 47%)}
.box-logo{position:absolute;left:34%;top:56%;transform:translateX(-50%) rotate(7deg);color:#282018;font-size:clamp(1.25rem,7vw,2.4rem);font-weight:900;letter-spacing:.18em}
@keyframes float{from{transform:translateY(10px)}to{transform:translateY(-16px)}}
@media(prefers-reduced-motion:reduce){.box-art{animation:none}}
.box-art{width:min(53vw,295px);flex:none}
.youtube{display:inline-flex;align-items:center;justify-content:center;width:clamp(70px,20vw,120px);aspect-ratio:1.42;border-radius:25%;background:#f03;color:white;box-shadow:0 13px 23px #0006;animation:float 2.6s ease-in-out infinite alternate;animation-delay:-1.2s}
.youtube::before{content:"";width:29%;aspect-ratio:1;background:white;clip-path:polygon(14% 0,100% 50%,14% 100%)}
.youtube:hover,.youtube:focus-visible{animation-play-state:paused;background:#da002b}
a:focus-visible{outline:3px solid #d2edb7;outline-offset:5px}
.watch{display:inline-block;color:white;font-weight:700;text-underline-offset:.25em}
.film{margin:.35rem 0 0;color:#e4eadc}
@media(prefers-reduced-motion:reduce){.youtube{animation:none}}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#192c22}
[hidden]{display:none!important}
main{position:relative}
#launch{margin-top:1.3rem;padding:.75rem 1.2rem;border:0;border-radius:2rem;background:#d9efc6;color:#192c22;min-height:44px;font:inherit;font-weight:750;cursor:pointer}
#status{margin:.55rem 0 0;font-size:.9rem}
body.camera-on main{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));pointer-events:none}
body.camera-on header,body.camera-on footer{padding:.65rem .9rem;border-radius:1rem;background:#192c22e8}
body.camera-on header h1{font-size:1.6rem}
body.camera-on .topic,body.camera-on .film{display:none}
body.camera-on .objects{position:fixed;left:var(--object-x,50%);top:var(--object-y,46%);transform:translate(-50%,-50%);min-height:0;padding:0}
body.camera-on a,body.camera-on button{pointer-events:auto}
</style>
<script defer src="./assets.js"></script>
</head>
<body>
<video id="camera" playsinline autoplay muted hidden></video>
<main>
  <header>
  <p class="project">UNBOXING · CASE STUDY</p>
  <h1>VEJA</h1>
  <p class="topic">Sustainable packaging &amp; forest-friendly sourcing</p>
  </header>
  <div class="objects">
    <div class="box-art" role="img" aria-label="Floating VEJA shoebox"><span class="box-front"></span><span class="box-side"></span><span class="box-top"></span><span class="box-lid"></span><strong class="box-logo" aria-hidden="true">VEJA</strong></div>
    <a class="youtube" href="https://www.youtube.com/watch?v=Q-WrXAsXuO0" aria-label="Watch VEJA’s Amazonian rubber film on YouTube"></a>
  </div>
  <footer>
  <a class="watch" href="https://www.youtube.com/watch?v=Q-WrXAsXuO0">Watch on YouTube</a>
  <p class="film">A True Story About Amazonian Rubber</p>
  <br><button id="launch" type="button">Open AR camera</button>
  <p id="status" role="status" hidden></p>
  </footer>
</main>
<script>
const camera = document.querySelector('#camera')
const launch = document.querySelector('#launch')
const status = document.querySelector('#status')
let stream
let controller
let busy = false

function report(message) {
  status.textContent = message
  status.hidden = !message
}

function centerObjects() {
  document.body.style.removeProperty('--object-x')
  document.body.style.removeProperty('--object-y')
}

function placeObjects(matrix, projection, markerSize) {
  if (!matrix || !markerSize) {
    centerObjects()
    return
  }
  const [width, height] = markerSize
  const x = matrix[0] * width / 2 + matrix[4] * height / 2 + matrix[12]
  const y = matrix[1] * width / 2 + matrix[5] * height / 2 + matrix[13]
  const z = matrix[2] * width / 2 + matrix[6] * height / 2 + matrix[14]
  const clipW = projection[3] * x + projection[7] * y + projection[11] * z + projection[15]
  if (clipW <= 0) return
  const ndcX = (projection[0] * x + projection[4] * y + projection[8] * z + projection[12]) / clipW
  const ndcY = (projection[1] * x + projection[5] * y + projection[9] * z + projection[13]) / clipW
  const coverScale = Math.max(camera.clientWidth / camera.videoWidth, camera.clientHeight / camera.videoHeight)
  const left = 50 + 50 * ndcX * camera.videoWidth * coverScale / camera.clientWidth
  const top = 50 - 50 * ndcY * camera.videoHeight * coverScale / camera.clientHeight
  document.body.style.setProperty('--object-x', Math.min(66, Math.max(34, left)) + '%')
  document.body.style.setProperty('--object-y', Math.min(64, Math.max(28, top)) + '%')
}

async function startTracking(activeStream) {
  let tracker
  try {
    const [{Controller}, target] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js'),
      fetch(window.vejaAssets.target).then(response => response.arrayBuffer())
    ])
    if (stream !== activeStream) return
    let markerSize
    let projection
    tracker = new Controller({
      inputWidth: camera.videoWidth,
      inputHeight: camera.videoHeight,
      onUpdate(update) {
        if (stream === activeStream && update.type === 'updateMatrix') {
          placeObjects(update.worldMatrix, projection, markerSize)
        }
      }
    })
    controller = tracker
    projection = tracker.getProjectionMatrix()
    const result = tracker.addImageTargetsFromBuffer(target)
    markerSize = result.dimensions[0]
    tracker.dummyRun(camera)
    if (stream !== activeStream) return
    tracker.processVideo(camera)
    report('Aim at the sneaker photo to position the shoebox.')
  } catch {
    if (stream !== activeStream) return
    controller?.stopProcessVideo()
    controller?.dispose()
    controller = undefined
    report('Camera is open. Photo tracking is temporarily unavailable.')
  }
}

function stopCamera() {
  controller?.stopProcessVideo()
  controller?.dispose()
  controller = undefined
  stream?.getTracks().forEach(track => track.stop())
  stream = undefined
  camera.srcObject = null
  camera.hidden = true
  document.body.classList.remove('camera-on')
  launch.textContent = 'Open AR camera'
  centerObjects()
  report('')
}

async function openCamera() {
  if (busy) return
  if (stream) return
  if (!navigator.mediaDevices?.getUserMedia) {
    report('Camera access is unavailable in this browser.')
    return
  }
  busy = true
  launch.disabled = true
  report('Opening the camera…')
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}}})
    camera.srcObject = stream
    camera.hidden = false
    await camera.play()
    document.body.classList.add('camera-on')
    launch.textContent = 'Close camera'
    report('The camera is open.')
    startTracking(stream)
  } catch {
    stopCamera()
    report('Camera access was unavailable. Try again and allow camera access when prompted.')
  } finally {
    busy = false
    launch.disabled = false
  }
}
launch.addEventListener('click', () => {
  if (stream) stopCamera()
  else openCamera()
})
window.addEventListener('pagehide', stopCamera)
openCamera()
</script>
</body>
</html>
