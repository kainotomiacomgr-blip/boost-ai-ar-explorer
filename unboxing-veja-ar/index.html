<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#163226;color:#f8f5e9;font:1rem/1.45 system-ui,sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
main{position:relative;margin:auto;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1rem;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
header,footer{width:min(100%,31rem);padding:.8rem 1rem;border-radius:16px;background:#163226f2;text-align:center}
h1,h2,p{margin:.2rem 0}.project{font-size:.76rem;font-weight:800;letter-spacing:.1em;color:#d4efad}
button{min-height:44px;padding:.45rem .72rem;border:1px solid #bdd39e;border-radius:10px;color:inherit;background:#254a36;font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #e0f7ac;outline-offset:4px}
#status{margin-bottom:.45rem}
#hotspots{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,4vw,24px);width:min(75vw,320px);z-index:1}
.camera-on #hotspots{position:fixed;left:clamp(40%,var(--object-x,50%),60%);top:clamp(38%,var(--object-y,49%),58%);transform:translate(-50%,-50%)}
#hotspots button{display:grid;justify-items:center;gap:.35rem;background:#163226eb;border-color:#dbecb5;border-radius:18px;padding:.55rem;font-weight:750;font-size:.83rem;animation:bob 2.7s ease-in-out infinite alternate}
#hotspots button:nth-child(2n){animation-delay:-1.3s}
#hotspots button:hover,#hotspots button:focus-visible,#hotspots button[aria-expanded=true]{animation-play-state:paused}
.dot{display:grid;place-items:center;border-radius:50%;width:42px;height:42px;background:#d9f0ae;color:#182e20;font-size:1.25rem;box-shadow:0 0 0 4px #d9f0ae33}
@keyframes bob{to{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){#hotspots button{animation:none}}
#fact{position:fixed;z-index:2;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),31rem);max-height:56svh;overflow:auto;background:#f8f4e8;color:#162e23;border-radius:17px;padding:1rem;box-shadow:0 12px 32px #0008}
#fact button{float:right;color:white}#fact h2{padding-right:4rem;font-size:1.2rem}#fact a{color:#254a36}
#qr{text-align:center;padding:1rem}#qr img{display:block;width:min(78vw,400px);margin:1rem auto;image-rendering:pixelated}#qr a{color:#d4efad}

<script>
const hotspots = document.querySelector('#hotspots')
const fact = document.querySelector('#fact')
const buttons = [...hotspots.querySelectorAll('button')]
const facts = [["Box sizes","19 sizes for a closer fit","VEJA reports using 19 shoebox sizes to avoid overusing materials. A box sized to the shoes leaves less empty space."],["Less filler","What a closer fit changes","A closer-fitting box can reduce the filler needed to keep shoes from shifting in transit."],["Recycled fibre","Less reliance on virgin fibre","The UNBOXING case study describes a blend of recycled and FSC-certified cardboard. Using recovered fibre can reduce the need for virgin fibre."],["FSC label","Look for the supplier number","VEJA says all its shoeboxes are FSC-certified. The FSC label on the box includes the certified supplier’s number."]]
let activeButton
let revealed = false
function cameraIsActive() {
  return stream?.getVideoTracks().some(track => track.readyState === 'live') &&
    !camera.hidden && !camera.paused
}
function hideFacts() {
  revealed = false
  hotspots.hidden = true
  fact.hidden = true
  activeButton?.setAttribute('aria-expanded', 'false')
  activeButton = undefined
}
function revealBox() {
  if (revealed || !cameraIsActive()) return
  revealed = true
  hotspots.hidden = false
  report('Tap a floating dot to reveal a packaging fact.')
}
for (const button of buttons) {
  button.addEventListener('click', () => {
    if (!revealed || !cameraIsActive()) return
    activeButton?.setAttribute('aria-expanded', 'false')
    activeButton = button
    button.setAttribute('aria-expanded', 'true')
    const [, title, copy] = facts[Number(button.dataset.fact)]
    document.querySelector('#fact-title').textContent = title
    document.querySelector('#fact-copy').textContent = copy
    fact.hidden = false
    document.querySelector('#close-fact').focus()
  })
}
function closeFact() {
  if (fact.hidden) return
  fact.hidden = true
  activeButton?.setAttribute('aria-expanded', 'false')
  activeButton?.focus()
}
document.querySelector('#close-fact').addEventListener('click', closeFact)
window.addEventListener('keydown', event => { if (event.key === 'Escape') closeFact() })
const camera = document.querySelector('#camera')
camera.addEventListener('pause', hideFacts)
const launch = document.querySelector('#launch')
const status = document.querySelector('#status')
let stream
let controller
let busy = false
let pageActive = true

function report(message) {
  status.textContent = message
  status.hidden = !message
}

function centerObjects() {
  document.body.style.removeProperty('--object-x')
  document.body.style.removeProperty('--object-y')
}

function placeObjects(matrix, projection, markerSize) {
  if (!matrix || !markerSize) {
    centerObjects()
    return
  }
  const [width, height] = markerSize
  const x = matrix[0] * width / 2 + matrix[4] * height / 2 + matrix[12]
  const y = matrix[1] * width / 2 + matrix[5] * height / 2 + matrix[13]
  const z = matrix[2] * width / 2 + matrix[6] * height / 2 + matrix[14]
  const clipW = projection[3] * x + projection[7] * y + projection[11] * z + projection[15]
  if (clipW <= 0) return
  const ndcX = (projection[0] * x + projection[4] * y + projection[8] * z + projection[12]) / clipW
  const ndcY = (projection[1] * x + projection[5] * y + projection[9] * z + projection[13]) / clipW
  const coverScale = Math.max(camera.clientWidth / camera.videoWidth, camera.clientHeight / camera.videoHeight)
  const left = 50 + 50 * ndcX * camera.videoWidth * coverScale / camera.clientWidth
  const top = 50 - 50 * ndcY * camera.videoHeight * coverScale / camera.clientHeight
  document.body.style.setProperty('--object-x', Math.min(66, Math.max(34, left)) + '%')
  document.body.style.setProperty('--object-y', Math.min(64, Math.max(28, top)) + '%')
}

async function startTracking(activeStream) {
  try {
    const [{Controller}, target] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js'),
      import("./logo-target.js").then(() => Uint8Array.from(atob(window.vejaTarget), character => character.charCodeAt(0)).buffer)
    ])
    if (stream !== activeStream) return
    // MindAR draws the video using its width and height attributes.
    // CSS sizes the preview independently of the source frame.
    camera.width = camera.videoWidth
    camera.height = camera.videoHeight
    if (!camera.width || !camera.height) throw new Error('Camera frame dimensions are unavailable')
    let markerSize
    let projection
    const tracker = new Controller({
      inputWidth: camera.width,
      inputHeight: camera.height,
      onUpdate(update) {
        if (stream === activeStream && update.type === 'updateMatrix') {
          if (update.targetIndex !== 0) return
          if (update.worldMatrix && markerSize) revealBox()
          placeObjects(update.worldMatrix, projection, markerSize)
        }
      }
    })
    controller = tracker
    projection = tracker.getProjectionMatrix()
    const result = tracker.addImageTargetsFromBuffer(target)
    markerSize = result.dimensions[0]
    tracker.dummyRun(camera)
    if (stream !== activeStream) return
    tracker.processVideo(camera)
    if (!revealed) report('Aim at the black-and-white VEJA logo to reveal the packaging dots.')
  } catch {
    if (stream !== activeStream) return
    controller?.stopProcessVideo()
    controller?.dispose()
    controller = undefined
    report('Photo tracking could not load. Close and reopen the camera to try again.')
  }
}

function stopCamera() {
  hideFacts()
  controller?.stopProcessVideo()
  controller?.dispose()
  controller = undefined
  stream?.getTracks().forEach(track => track.stop())
  stream = undefined
  camera.srcObject = null
  camera.hidden = true
  document.body.classList.remove('camera-on')
  launch.textContent = 'Open AR camera'
  centerObjects()
  report('')
}

async function requestCamera() {
  try {
    return await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {facingMode: {ideal: 'environment'}, width: {ideal: 960}, height: {ideal: 720}}
    })
  } catch (error) {
    if (!['NotFoundError', 'OverconstrainedError'].includes(error.name)) throw error
    return navigator.mediaDevices.getUserMedia({audio: false, video: true})
  }
}

function cameraErrorMessage(error) {
  switch (error.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Camera access is blocked. Open this link in Safari or Chrome and allow camera access in the site settings.'
    case 'NotReadableError':
    case 'AbortError':
      return 'The camera could not start. Close other apps or tabs using it, then tap Open AR camera.'
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No usable camera was found.'
    default:
      return 'Could not open the camera. Tap Open AR camera to try again.'
  }
}

async function openCamera() {
  if (busy || !pageActive) return
  if (!navigator.mediaDevices?.getUserMedia) {
    report('This browser cannot access the camera. Open the experience in Safari or Chrome,.')
    return
  }
  busy = true
  launch.disabled = true
  report('Allow camera access, then aim at the black-and-white VEJA logo.')
  const promptTimer = setTimeout(() => {
    if (!stream && pageActive) report('Still waiting for camera permission. Check for the browser prompt or open the link in Safari or Chrome.')
  }, 7000)
  try {
    if (!stream) {
      const nextStream = await requestCamera()
      if (!pageActive) {
        nextStream.getTracks().forEach(track => track.stop())
        return
      }
      stream = nextStream
      for (const track of nextStream.getVideoTracks()) {
        track.addEventListener('ended', () => {
          if (stream === nextStream) stopCamera()
        }, {once: true})
      }
      camera.muted = true
      camera.srcObject = stream
    }
    const activeStream = stream
    camera.hidden = false
    try {
      await camera.play()
    } catch {
      if (stream === activeStream) {
        camera.hidden = true
        launch.textContent = 'Start camera preview'
        report('Tap Start camera preview to show the live feed.')
      }
      return
    }
    if (stream !== activeStream) return
    document.body.classList.add('camera-on')
    launch.textContent = 'Close camera'
    report('Camera is open. Loading photo recognition…')
    startTracking(stream)
  } catch (error) {
    stopCamera()
    if (pageActive) report(cameraErrorMessage(error))
  } finally {
    clearTimeout(promptTimer)
    busy = false
    launch.disabled = false
  }
}
launch.addEventListener('click', () => {
  if (document.body.classList.contains('camera-on')) stopCamera()
  else openCamera()
})
window.addEventListener('pagehide', () => {
  pageActive = false
  stopCamera()
})
window.addEventListener('pageshow', () => { pageActive = true })
if (new URLSearchParams(location.search).has('qr')) {
  document.querySelector('main').hidden = true
  document.querySelector('#qr').hidden = false
} else {
  openCamera()
}

</script></body></html>
