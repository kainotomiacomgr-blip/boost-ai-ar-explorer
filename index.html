<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOOST-AI · Image Target WebAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,Arial;color:white}.overlay{position:fixed;z-index:10;inset:0;pointer-events:none}.top{position:absolute;top:0;left:0;right:0;background:#06394aee;padding:12px 16px;text-align:center;font-weight:800;color:#ddf67d}.hint{position:absolute;top:51px;left:4%;right:4%;text-align:center;background:#092d3de8;border:1px solid #42acb9;border-radius:9px;padding:9px;font-size:14px}.panel{position:absolute;bottom:0;left:0;right:0;background:#092936f4;padding:12px;max-height:46vh;overflow:auto;pointer-events:auto}.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.goals button{padding:12px 3px;border-radius:9px;border:1px solid #7ed4d6;color:white;background:#145164;font-weight:800}.goals button.active{background:#368377;outline:2px solid #dffc78}#details{font-size:.85rem;line-height:1.45}#details h2{font-size:1.03rem;color:#e3fb91;margin:10px 0 6px}#details p{margin:6px 0}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;background:transparent!important;z-index:1!important}a-scene canvas{background:transparent!important}.mindar-ui-overlay,.mindar-ui-loading,.mindar-ui-scanning{pointer-events:none!important}.a-enter-vr{display:none!important}@media(min-width:800px){.panel{max-width:650px;left:50%;transform:translateX(-50%)}}</style></head>
<body><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: false; uiLoading: false;" color-space="sRGB" renderer="colorManagement: true; alpha: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="poster" mindar-image-target="targetIndex: 0"><a-entity position="0 .18 .17"><a-sphere radius=".24" segments-width="40" segments-height="30" material="color: #1687dd; roughness: 0.75; metalness: 0.1" animation="property:rotation;to:0 360 0;loop:true;dur:12500;easing:linear"></a-sphere><a-torus radius=".32" radius-tubular=".006" rotation="75 0 16" color="#c8f778"></a-torus><a-entity animation="property:rotation;to:0 360 0;loop:true;dur:6500;easing:linear"><a-box position=".32 0 0" width=".05" height=".035" depth=".035" color="#f0f5f6"></a-box></a-entity></a-entity><a-text value="AI FOR EARTH" color="#dffe97" position="0 -.38 .11" width="1.2" align="center"></a-text></a-entity></a-scene>
<div class="overlay"><div class="top">BOOST-AI · Image-Triggered WebAR</div><div class="hint" id="hint"><div id="guidance">Allow camera access when prompted. Point your phone at the complete SDG poster to make the floating Earth appear.</div></div><div class="panel"><div class="goals"><button data-goal="9" class="active">SDG 9</button><button data-goal="13">SDG 13</button><button data-goal="15">SDG 15</button><button data-goal="17">SDG 17</button></div><div id="details"><h2 id="title"></h2><p id="overview"></p><p><b>How AI helps:</b> <span id="ai"></span></p><p><b>Example:</b> <span id="example"></span></p><p><b>Reflect:</b> <span id="question"></span></p></div></div></div>
<script>
const sdgs={
9:{title:"SDG 9 — Innovation and Infrastructure",overview:"Promotes resilient infrastructure and sustainable industry.",ai:"AI can detect manufacturing equipment anomalies and reduce wasted energy through sensor analysis.",example:"A factory identifies unusually energy-intensive machines from smart-meter patterns and verifies the findings.",question:"What measurements would make this analysis trustworthy?"},
13:{title:"SDG 13 — Climate Action",overview:"Addresses climate change and associated risks.",ai:"AI can analyse satellite imagery, rainfall observations and land-cover data to support climate risk assessment.",example:"A city maps areas potentially at risk of flooding before experts validate the results.",question:"How should local knowledge inform an AI risk prediction?"},
15:{title:"SDG 15 — Life on Land",overview:"Protects biodiversity and terrestrial ecosystems.",ai:"Computer vision can identify wildlife images and flag possible changes in forest cover.",example:"Conservation workers investigate changes flagged by AI-assisted satellite-image comparisons.",question:"What happens when a habitat change is incorrectly classified?"},
17:{title:"SDG 17 — Partnerships",overview:"Strengthens cooperation and shared knowledge for sustainable development.",ai:"Data sharing and analytical tools can support collaboration between research groups, NGOs and public agencies.",example:"Partners combine approved biodiversity indicators in a common dashboard.",question:"What rules should partners agree before sharing data?"}
};
function select(id){const d=sdgs[id];document.querySelectorAll("[data-goal]").forEach(b=>b.classList.toggle("active",b.dataset.goal===id));for(const k of ["title","overview","ai","example","question"])document.getElementById(k).textContent=d[k]}
document.querySelectorAll("[data-goal]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.goal)));select("9");const target=document.getElementById("poster"),hint=document.getElementById("hint");const guidance=document.getElementById("guidance"),scene=document.querySelector("a-scene");
target.setAttribute("visible","false");
target.addEventListener("targetFound",()=>{target.setAttribute("visible","true");guidance.textContent="Poster recognised! Floating Earth activated. Select an SDG below to explore.";});
target.addEventListener("targetLost",()=>{target.setAttribute("visible","false");guidance.textContent="Point your camera at the complete poster to see the Earth again.";});
scene.addEventListener("arReady",()=>{guidance.textContent="Camera ready. Point at the full SDG poster with good lighting.";});
scene.addEventListener("arError",e=>{guidance.textContent="AR camera or tracker failed to start. Check Chrome camera permissions and reload.";});
window.addEventListener("error",e=>{if(e.message)guidance.textContent="Page error: "+e.message});
</script></body></html>
