<script>
const camera = document.querySelector('#camera')
const control = document.querySelector('#camera-button')
const stage = document.querySelector('#stage')
const status = document.querySelector('#status')
let stream
let requesting = false
let pageActive = true

function showCameraStage(visible) {
  stage.hidden = !visible

}

function stopCamera(message = 'Allow camera access to see the mailer.') {
  const previousStream = stream
  stream = undefined
  previousStream?.getTracks().forEach(track => track.stop())
  camera.srcObject = null
  camera.hidden = true
  showCameraStage(false)
  control.textContent = 'Open AR camera'
  status.textContent = message
}

function cameraIsActive() {
  return stream?.getVideoTracks().some(track => track.readyState === 'live') && !camera.paused && !camera.hidden
}

async function openCamera() {
  if (requesting || stream || !pageActive) return
  if (!navigator.mediaDevices?.getUserMedia) {
    status.textContent = 'Open this page in Safari or Chrome to use the camera.'
    return
  }
  requesting = true
  control.disabled = true
  status.textContent = 'Allow camera access when prompted.'
  try {
    const activeStream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}}})
    if (!pageActive) {
      activeStream.getTracks().forEach(track => track.stop())
      return
    }
    stream = activeStream
    for (const track of stream.getVideoTracks()) {
      track.addEventListener('ended', () => {
        if (stream === activeStream) stopCamera('Camera stopped. Tap Open AR camera to restart.')
      }, {once:true})
    }
    camera.muted = true
    camera.srcObject = activeStream
    camera.hidden = false
    await camera.play()
    if (stream !== activeStream || !cameraIsActive()) return
    showCameraStage(true)
    control.textContent = 'Close camera'
    status.textContent = ''
  } catch (error) {
    stopCamera(error.name === 'NotAllowedError'
      ? 'Allow camera access in your browser settings, then tap Open AR camera.'
      : 'Camera could not start. Tap Open AR camera to retry.')
  } finally {
    requesting = false
    control.disabled = false
  }
}

camera.addEventListener('pause', () => showCameraStage(false))
camera.addEventListener('playing', () => {
  if (cameraIsActive()) showCameraStage(true)
})
control.addEventListener('click', () => {
  if (stream) stopCamera()
  else openCamera()
})
window.addEventListener('pagehide', () => {
  pageActive = false
  stopCamera()
})
window.addEventListener('pageshow', () => { pageActive = true })
if (new URLSearchParams(location.search).has('qr')) {
  document.querySelector('#experience').hidden = true
  document.querySelector('#qr').hidden = false
} else {
  openCamera()
}


const mailer = document.querySelector('#mailer')
mailer.addEventListener('click', event => {
  if (!cameraIsActive() || stage.hidden) event.preventDefault()
})
</script></body></html>
